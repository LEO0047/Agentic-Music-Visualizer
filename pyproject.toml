[project]
name = "amv"
version = "0.1.0"
description = "Agentic Music Visualizer — TouchDesigner reflex layer + Codex/GPT director sidecar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-osc>=1.8",
    "numpy>=1.26",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
bpm = ["aubio>=0.4.9"]

[project.scripts]
amv-smoke = "amv.smoke:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amv"]

[tool.hatch.build.targets.sdist]
include = ["amv", "tests", "tools", "director_schema.json", "SPEC.md", "VISION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
