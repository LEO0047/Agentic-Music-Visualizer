name: Portable regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install locked portable dependencies
        run: uv sync --locked
      - name: Run portable tests without real AI or audio devices
        run: uv run --no-sync pytest -q
      - name: Check Python syntax
        run: uv run --no-sync python -m compileall -q amv td tools
      - name: Check patch whitespace
        run: git diff --check

# TouchDesigner, physical audio/MIDI, real AI/account usage, and the one-hour
# wall-clock endurance run are deliberately separate acceptance checks.
